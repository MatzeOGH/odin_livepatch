name: tests

on:
  push:
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab

jobs:
  # Odin master is built once per platform. The test jobs download the result.
  # The tests do not import vendor:, so no LFS and no vendor/ folder.
  odin-windows:
    name: Build Odin master (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: odin-lang/Odin
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: build.bat release
      - name: Pack
        shell: pwsh
        run: tar -czf odin.tar.gz odin.exe LLVM-C.dll base core shared bin
      - uses: actions/upload-artifact@v4
        with:
          name: odin-windows
          path: odin.tar.gz
          retention-days: 1

  odin-linux:
    name: Build Odin master (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: odin-lang/Odin
      - name: Build (static, same recipe as the Odin nightly)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.24 sh -c '
            apk add --no-cache musl-dev llvm20-dev clang20 build-base git mold lz4               libxml2-static llvm20-static zlib-static zstd-static make &&
            git config --global --add safe.directory /src &&
            ./ci/build_linux_static.sh
          '
      - name: Pack
        # A tarball keeps the executable bit, upload-artifact does not.
        run: tar -czf odin.tar.gz odin base core shared
      - uses: actions/upload-artifact@v4
        with:
          name: odin-linux
          path: odin.tar.gz
          retention-days: 1

  windows:
    name: Windows x64 -o:${{ matrix.opt }}
    needs: odin-windows
    runs-on: windows-2025 # its image has cdb, for the debugger tests
    timeout-minutes: 30
    strategy:
      fail-fast: false # each -o: level reports on its own
      matrix:
        opt: [none, minimal, speed]
    env:
      OPT: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: odin-windows
          path: ${{ runner.temp }}

      - name: Unpack Odin master
        shell: pwsh
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP\odin" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\odin.tar.gz" -C "$env:RUNNER_TEMP\odin"
          "$env:RUNNER_TEMP\odin" >> $env:GITHUB_PATH

      - name: Show the toolchain
        shell: pwsh
        run: |
          odin version
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
          "cdb: $cdb, found: $(Test-Path $cdb)"

      - name: Tests
        shell: pwsh
        run: tests\ci\run.ps1

      - name: Debugger tests (cdb)
        # Only at -o:none: optimized code removes the locals and inlines the frames that the
        # debugger tests read. Also when the tests failed.
        if: matrix.opt == 'none' && (success() || failure())
        shell: pwsh
        env:
          DEBUGGER: cdb
        run: tests\ci\run_debugger.ps1

      - name: Get the RAD Debugger
        if: matrix.opt == 'none' && (success() || failure())
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.29-alpha -R EpicGamesExt/raddebugger --pattern raddbg.exe -D "$env:RUNNER_TEMP\raddbg"
          "RADDBG=$env:RUNNER_TEMP\raddbg\raddbg.exe" >> $env:GITHUB_ENV

      - name: Debugger tests (raddbg)
        if: matrix.opt == 'none' && (success() || failure())
        shell: pwsh
        env:
          DEBUGGER: raddbg
        run: tests\ci\run_debugger.ps1

  linux:
    name: Linux x64 -o:${{ matrix.opt }} ${{ matrix.reloc }}
    needs: odin-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # each -o: level and each relocation mode reports on its own
      matrix:
        opt: [none, minimal, speed]
        reloc: [pie, static] # static: -reloc-mode:static
    env:
      OPT: ${{ matrix.opt }}
      RELOC: ${{ matrix.reloc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the patch linker and the debuggers
        run: sudo apt-get update && sudo apt-get install -y lld gdb lldb

      - uses: actions/download-artifact@v4
        with:
          name: odin-linux
          path: ${{ runner.temp }}

      - name: Unpack Odin master
        run: |
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: |
          odin version
          ld.lld --version
          gdb --version | head -n 1
          lldb --version

      - name: Tests
        shell: pwsh
        run: tests/ci/run.ps1

      - name: Debugger tests (gdb, lldb)
        # Only at -o:none: optimized code removes the locals and inlines the frames that the
        # debugger tests read. Also when the tests failed.
        if: matrix.opt == 'none' && (success() || failure())
        shell: pwsh
        run: tests/ci/run_debugger.ps1
