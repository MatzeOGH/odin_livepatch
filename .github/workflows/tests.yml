name: tests

on:
  push:
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab

jobs:
  windows:
    name: Windows x64 -o:${{ matrix.opt }}
    runs-on: windows-2025 # its image has cdb, for the debugger tests
    timeout-minutes: 30
    strategy:
      fail-fast: false # each -o: level reports on its own
      matrix:
        opt: [none, minimal, speed]
    env:
      OPT: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest Odin release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R odin-lang/Odin --pattern 'odin-windows-amd64-*.zip' -O odin.zip
          Expand-Archive odin.zip "$env:RUNNER_TEMP\odin"
          (Get-ChildItem "$env:RUNNER_TEMP\odin" -Recurse -Filter odin.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH

      - name: Show the toolchain
        shell: pwsh
        run: |
          odin version
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
          "cdb: $cdb, found: $(Test-Path $cdb)"

      - name: Tests
        shell: pwsh
        run: tests\ci\run.ps1

      - name: Debugger tests (cdb)
        # Only at -o:none: optimized code removes the locals and inlines the frames that the
        # debugger tests read. Also when the tests failed.
        if: matrix.opt == 'none' && (success() || failure())
        shell: pwsh
        run: tests\ci\run_debugger.ps1

  linux:
    name: Linux x64 -o:${{ matrix.opt }} ${{ matrix.reloc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # each -o: level and each relocation mode reports on its own
      matrix:
        opt: [none, minimal, speed]
        reloc: [pie, static] # static: -reloc-mode:static
    env:
      OPT: ${{ matrix.opt }}
      RELOC: ${{ matrix.reloc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the patch linker and the debuggers
        run: sudo apt-get update && sudo apt-get install -y lld gdb lldb

      - name: Get the latest Odin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R odin-lang/Odin --pattern 'odin-linux-amd64-*.tar.gz' -O odin.tar.gz
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf odin.tar.gz -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -name odin -type f | head -n 1)" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: |
          odin version
          ld.lld --version
          gdb --version | head -n 1
          lldb --version

      - name: Tests
        shell: pwsh
        run: tests/ci/run.ps1

      - name: Debugger tests (gdb, lldb)
        # Only at -o:none: optimized code removes the locals and inlines the frames that the
        # debugger tests read. Also when the tests failed.
        if: matrix.opt == 'none' && (success() || failure())
        shell: pwsh
        run: tests/ci/run_debugger.ps1
