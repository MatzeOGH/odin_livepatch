name: tests

# Each platform is a chain: build Odin master -> tests at each -o: level. The -o:none job then
# also runs the debugger tests: optimized code removes the locals and inlines the frames that the
# debugger tests read. A platform does not wait for the Odin builds of the other platforms.
on:
  push:
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab

jobs:
  # The Odin builds upload the artifact odin-<runner.os>-<runner.arch>, which
  # .github/actions/setup-odin downloads. The build is cached by the Odin master commit: when
  # master did not change, the job only uploads the cached build. The tests do not import vendor:,
  # so no LFS and no vendor/ folder.
  odin-windows:
    name: Build Odin master (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Find the Odin master commit
        id: odin
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/odin-lang/Odin HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: odin.tar.gz
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ steps.odin.outputs.sha }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: odin-lang/Odin
          ref: ${{ steps.odin.outputs.sha }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: build.bat release
      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: tar -czf odin.tar.gz odin.exe LLVM-C.dll base core shared bin
      - uses: actions/upload-artifact@v4
        with:
          name: odin-${{ runner.os }}-${{ runner.arch }}
          path: odin.tar.gz
          retention-days: 1

  odin-linux:
    name: Build Odin master (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find the Odin master commit
        id: odin
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/odin-lang/Odin HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: odin.tar.gz
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ steps.odin.outputs.sha }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: odin-lang/Odin
          ref: ${{ steps.odin.outputs.sha }}
      - name: Build (static, same recipe as the Odin nightly)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.24 sh -c '
            apk add --no-cache musl-dev llvm20-dev clang20 build-base git mold lz4               libxml2-static llvm20-static zlib-static zstd-static make &&
            git config --global --add safe.directory /src &&
            ./ci/build_linux_static.sh
          '
      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        # A tarball keeps the executable bit, upload-artifact does not.
        run: tar -czf odin.tar.gz odin base core shared
      - uses: actions/upload-artifact@v4
        with:
          name: odin-${{ runner.os }}-${{ runner.arch }}
          path: odin.tar.gz
          retention-days: 1

  odin-macos-arm:
    name: Build Odin master (macOS ARM)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Find the Odin master commit
        id: odin
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/odin-lang/Odin HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: odin.tar.gz
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ steps.odin.outputs.sha }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: odin-lang/Odin
          ref: ${{ steps.odin.outputs.sha }}
      - name: Install LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install llvm@20
      - name: Build (same recipe as Odin's own CI)
        if: steps.cache.outputs.cache-hit != 'true'
        # odin links libLLVM from Homebrew. The test job must install llvm@20 too.
        run: CPPFLAGS="$CPPFLAGS -I/opt/homebrew/opt/llvm@20/include" LDFLAGS="$LDFLAGS -L/usr/lib/system -L/usr/lib -L/opt/homebrew/opt/llvm@20/lib" LLVM_CONFIG=/opt/homebrew/opt/llvm@20/bin/llvm-config ./build_odin.sh release
      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: tar -czf odin.tar.gz odin base core shared
      - uses: actions/upload-artifact@v4
        with:
          name: odin-${{ runner.os }}-${{ runner.arch }}
          path: odin.tar.gz
          retention-days: 1

  windows:
    name: Windows x64 -o:${{ matrix.opt }}
    needs: odin-windows
    runs-on: windows-2025 # its image has cdb
    timeout-minutes: 45
    strategy:
      fail-fast: false # each -o: level reports on its own
      matrix:
        opt: [none, minimal, speed]
    env:
      OPT: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-odin

      - name: Tests
        shell: pwsh
        run: tests\ci\run.ps1

      - name: Get the RAD Debugger
        if: matrix.opt == 'none' && !cancelled()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.29-alpha -R EpicGamesExt/raddebugger --pattern raddbg.exe -D "$env:RUNNER_TEMP\raddbg"
          "RADDBG=$env:RUNNER_TEMP\raddbg\raddbg.exe" >> $env:GITHUB_ENV
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
          "cdb: $cdb, found: $(Test-Path $cdb)"

      # !cancelled(): the debugger results also show when the tests above fail
      - name: Debugger tests (cdb, raddbg)
        if: matrix.opt == 'none' && !cancelled()
        shell: pwsh
        run: tests\ci\run_debugger.ps1

  linux:
    name: Linux x64 -o:${{ matrix.opt }} ${{ matrix.reloc }}
    needs: odin-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # each -o: level and each relocation mode reports on its own
      matrix:
        opt: [none, minimal, speed]
        reloc: [pie, static] # static: -reloc-mode:static
    env:
      OPT: ${{ matrix.opt }}
      RELOC: ${{ matrix.reloc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the patch linker (and at -o:none the debuggers)
        run: sudo apt-get update && sudo apt-get install -y lld ${{ matrix.opt == 'none' && 'gdb lldb' || '' }}

      - uses: ./.github/actions/setup-odin

      - name: Show the toolchain
        run: |
          ld.lld --version
          if [ "$OPT" = none ]; then gdb --version | head -n 1; lldb --version | head -n 1; fi

      - name: Tests
        shell: pwsh
        run: tests/ci/run.ps1

      # !cancelled(): the debugger results also show when the tests above fail
      - name: Debugger tests (gdb, lldb)
        if: matrix.opt == 'none' && !cancelled()
        shell: pwsh
        run: tests/ci/run_debugger.ps1

  macos-arm:
    # Port in progress: only the tests that pass on macOS so far. Add a test here when it passes.
    name: macOS ARM -o:${{ matrix.opt }}
    needs: odin-macos-arm
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false # each -o: level reports on its own
      matrix:
        opt: [none, minimal, speed]
    env:
      OPT: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (odin links it) and the patch linker
        run: brew install llvm@20 lld

      - uses: ./.github/actions/setup-odin

      - name: Show the toolchain
        run: |
          uname -m
          sw_vers
          ld -v 2>&1 | head -n 1
          /opt/homebrew/opt/lld/bin/ld64.lld --version

      - name: Unit tests (Mach-O parsing, linker search)
        shell: bash # -o pipefail: the tee must not hide a failure
        # -use-separate-modules as in a livepatch build: else -o:speed makes every symbol internal
        # Debug logs, plain output, one test at a time, so the log reads in order
        run: >
          odin test livepatch -o:${{ matrix.opt }} -use-separate-modules
          -define:ODIN_TEST_LOG_LEVEL=debug -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_THREADS=1
          2>&1 | tee macho_test.log

      - name: Upload the unit test log
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: macho-test-log-${{ matrix.opt }}
          path: macho_test.log
          if-no-files-found: ignore

      - name: Tests
        shell: pwsh
        run: tests/ci/run.ps1 change_proc

      - name: Upload the patch output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: livepatch-macos-arm-${{ matrix.opt }}
          path: tests/ci/*/livepatch*/
          if-no-files-found: ignore
